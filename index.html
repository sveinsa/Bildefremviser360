<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Bildefremviser 360</title>
  <meta name="description" content="Enkel visning og drag-and-drop av 360-bilder med kartvisning." />

  <!-- Open Graph / Teams-forhåndsvisning -->
  <meta property="og:site_name" content="Bildefremviser 360" />
  <meta property="og:title" content="Bildefremviser 360" />
  <meta property="og:description" content="Enkel visning og drag-and-drop av 360-bilder med kartvisning." />
  <meta property="og:type" content="website" />

  <!-- Pannellum 360 Viewer CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>

  <!-- Leaflet for Kartvisning -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- EXIF.js for å hente GPS-data fra bildet -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #d8e2d2;
      color: #1a1d1e;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* --- Skjerm 1: Opplasting --- */
    #upload-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .top-header {
      padding: 24px 32px;
      flex-shrink: 0;
    }
    .top-header p {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #5a6b4d;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .top-header h1 { 
      font-size: 1.8rem; 
      font-weight: 300; 
      color: #1a1d1e;
    }
    
    .main-card {
      flex-grow: 1;
      background: #ffffff;
      border-radius: 12px 12px 0 0;
      margin: 0 16px;
      padding: 24px;
      box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
    }

    .drop-zone {
      flex-grow: 1;
      border: 1px dashed #b8c4b2;
      border-radius: 8px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drop-zone:hover, .drop-zone.dragover { 
      background: #f9fbf8; 
      border-color: #82a760;
    }
    
    .upload-icon {
      width: 56px;
      height: 56px;
      background: #fff;
      border: 1px solid #e2e8e0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: transform 0.2s;
    }
    .drop-zone:hover .upload-icon { transform: scale(1.05); }
    .upload-icon svg { stroke: #6b8258; }

    .drop-zone h2 {
      font-size: 1.1rem; 
      font-weight: 300; 
      margin-bottom: 24px; 
      color: #444;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: #555;
      transition: all 0.2s;
    }
    .btn:hover { background: #f8fbf5; border-color: #82a760; color: #1a1d1e; }

    /* --- Skjerm 2: 360-visning & overlays --- */
    #panorama-wrapper {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: #000;
    }
    #panorama { width: 100%; height: 100%; }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 30;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
    }

    /* Sidepanel for Bildeliste */
    #sidebar {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 260px;
      max-height: calc(100% - 340px);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      z-index: 25;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 12px 16px;
      background: #f1f5ee;
      border-bottom: 1px solid #e2e8e0;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #5a6b4d;
    }
    .file-list {
      list-style: none;
      overflow-y: auto;
      margin: 0;
      padding: 0;
    }
    .file-item {
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #333;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s;
    }
    .file-item:hover {
      background: #f8fbf5;
    }
    .file-item.active {
      background: #82a760;
      color: #ffffff;
      font-weight: 500;
    }

    /* Kartvisning */
    #map {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 280px;
      height: 280px;
      border-radius: 8px;
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      z-index: 20;
      background: #fcfcfb;
    }
    .leaflet-control-attribution { display: none !important; }

    @keyframes blink-beam {
      0% { opacity: 0.1; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.1; transform: scale(0.9); }
    }
    .blinking-beam {
      animation: blink-beam 2s infinite ease-in-out;
      transform-origin: 30px 30px;
    }

    /* Passiv kartnål for ikke-aktive bilder */
    .passive-marker {
      width: 16px;
      height: 16px;
      background: #1a1d1e;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .passive-marker:hover {
      transform: scale(1.3);
      background: #82a760;
    }
  </style>
</head>
<body>

  <!-- Skjerm 1: Opplastingsområdet -->
  <div id="upload-screen">
    <div class="top-header">
      <p>360-foto</p>
      <h1>Bildefremviser</h1>
    </div>

    <div class="main-card">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <h2>Dra og slipp et eller flere 360-bilder her</h2>
        <button class="btn" style="pointer-events: none;">Velg filer fra disk</button>
        <!-- multiple tillater opplasting av flere filer -->
        <input type="file" id="fileInput" accept="image/jpeg, image/png" multiple style="display: none;" onchange="handleFiles(this.files)" />
      </div>
    </div>
  </div>

  <!-- Skjerm 2: 360-visning -->
  <div id="panorama-wrapper">
    <button class="btn close-btn" onclick="resetViewer()">Lukk bilde</button>

    <!-- Sidevindu for bildeliste -->
    <div id="sidebar">
      <div class="sidebar-header">Opplastede bilder</div>
      <ul class="file-list" id="fileList"></ul>
    </div>

    <div id="panorama"></div>
    <div id="map"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    let viewer = null;
    let map = null;
    let syncRAF = null;
    
    let imageStore = []; // Array av { id, name, url, lat, lng, imgDir }
    let activeImageId = null;
    let mapMarkers = {}; // Kartmarkører nøklet på bilde-id

    // --- Drag & Drop Håndtering ---
    dropZone.addEventListener('dragover', (e) => { 
      e.preventDefault(); 
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => { 
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    // --- Behandle flere filer ---
    async function handleFiles(files) {
      const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (!validFiles.length) return;

      for (let file of validFiles) {
        const url = URL.createObjectURL(file);
        const metadata = await extractExif(file);
        
        imageStore.push({
          id: 'img_' + Math.random().toString(36).substr(2, 9),
          name: file.name,
          url: url,
          lat: metadata.lat,
          lng: metadata.lng,
          imgDir: metadata.imgDir || 0
        });
      }

      document.getElementById('upload-screen').style.display = 'none';
      document.getElementById('panorama-wrapper').style.display = 'block';

      renderSidebar();
      initMap();
      
      // Åpne første bilde som standard
      if (imageStore.length > 0) {
        selectImage(imageStore[0].id);
      }
    }

    // --- Les EXIF data asynchronously ---
    function extractExif(file) {
      return new Promise((resolve) => {
        EXIF.getData(file, function() {
          const lat = EXIF.getTag(this, "GPSLatitude");
          const lng = EXIF.getTag(this, "GPSLongitude");
          let latDeg = null, lngDeg = null, imgDir = 0;

          if (lat && lng) {
            latDeg = getNum(lat[0]) + getNum(lat[1])/60 + getNum(lat[2])/3600;
            lngDeg = getNum(lng[0]) + getNum(lng[1])/60 + getNum(lng[2])/3600;
            if (EXIF.getTag(this, "GPSLatitudeRef") === 'S') latDeg = -latDeg;
            if (EXIF.getTag(this, "GPSLongitudeRef") === 'W') lngDeg = -lngDeg;
            
            const dir = EXIF.getTag(this, "GPSImgDirection");
            if (dir) imgDir = getNum(dir);
          }
          resolve({ lat: latDeg, lng: lngDeg, imgDir: imgDir });
        });
      });
    }

    function getNum(val) {
      if (!val) return 0;
      if (val.numerator !== undefined) return val.numerator / val.denominator;
      return parseFloat(val);
    }

    // --- Bygg sideliste ---
    function renderSidebar() {
      const listContainer = document.getElementById('fileList');
      listContainer.innerHTML = '';

      imageStore.forEach(img => {
        const li = document.createElement('li');
        li.className = `file-item ${img.id === activeImageId ? 'active' : ''}`;
        li.textContent = img.name;
        li.onclick = () => selectImage(img.id);
        listContainer.appendChild(li);
      });
    }

    // --- Velg og vis et bilde ---
    function selectImage(id) {
      activeImageId = id;
      const imgData = imageStore.find(item => item.id === id);
      if (!imgData) return;

      renderSidebar();
      initViewer(imgData.url);
      updateMapMarkers();
    }

    // --- Pannellum 360 Viewer ---
    function initViewer(url) {
      if (viewer) viewer.destroy();
      viewer = pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: url,
        autoLoad: true,
        showZoomCtrl: true,
        mouseZoom: true,
        compass: false 
      });
      
      cancelAnimationFrame(syncRAF);
      syncLoop();
    }

    // --- Opprett/Init Kart ---
    function initMap() {
      document.getElementById('map').style.display = 'block';

      if (!map) {
        map = L.map('map', {
          zoomControl: true, 
          attributionControl: false, 
          dragging: true, 
          scrollWheelZoom: true
        }).setView([0, 0], 2);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
      }

      updateMapMarkers();
    }

    // --- Oppdater Markører på Kartet ---
    function updateMapMarkers() {
      if (!map) return;

      // Fjern eksisterende markører
      Object.values(mapMarkers).forEach(m => map.removeLayer(m));
      mapMarkers = {};

      const validCoords = [];

      imageStore.forEach(img => {
        if (img.lat === null || img.lng === null) return;

        validCoords.push([img.lat, img.lng]);
        const isActive = (img.id === activeImageId);

        let icon;
        if (isActive) {
          // Aktiv kompassnål med animated retningskjegle
          const iconHtml = `
            <div id="compass-marker" style="width: 60px; height: 60px; transform-origin: center;">
              <svg width="60" height="60" viewBox="0 0 60 60" style="overflow: visible;">
                <defs>
                  <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#82a760" stop-opacity="0" />
                    <stop offset="100%" stop-color="#82a760" stop-opacity="0.85" />
                  </linearGradient>
                </defs>
                <path class="blinking-beam" d="M30 30 L10 5 A 30 30 0 0 1 50 5 Z" fill="url(#beamGrad)" />
                <path d="M30 15 L40 38 L30 33 L20 38 Z" fill="#1a1d1e" stroke="#ffffff" stroke-width="2.5" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));" />
              </svg>
            </div>`;
          icon = L.divIcon({ html: iconHtml, className: '', iconSize: [60, 60], iconAnchor: [30, 30] });
        } else {
          // Passiv kartnål for andre bilder
          icon = L.divIcon({
            html: `<div class="passive-marker"></div>`,
            className: '',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });
        }

        const m = L.marker([img.lat, img.lng], { icon: icon, zIndexOffset: isActive ? 1000 : 0 }).addTo(map);
        m.on('click', () => selectImage(img.id));
        mapMarkers[img.id] = m;
      });

      // Sentrer kartet rundt det aktive bildet eller alle punkter
      const activeImg = imageStore.find(img => img.id === activeImageId);
      if (activeImg && activeImg.lat !== null) {
        map.setView([activeImg.lat, activeImg.lng], 15);
      } else if (validCoords.length > 0) {
        map.fitBounds(validCoords);
      }
    }

    // --- Synkroniser Kompassrotering ---
    function syncLoop() {
      const compassMarker = document.getElementById('compass-marker');
      const activeImg = imageStore.find(img => img.id === activeImageId);

      if (viewer && compassMarker && activeImg) {
          const yaw = viewer.getYaw();
          const totalRotation = yaw + activeImg.imgDir;
          compassMarker.style.transform = `rotate(${totalRotation}deg)`;
      }
      syncRAF = requestAnimationFrame(syncLoop);
    }

    // --- Tilbakestill Alt ---
    function resetViewer() {
      if (viewer) { viewer.destroy(); viewer = null; }
      if (map) { map.remove(); map = null; }
      cancelAnimationFrame(syncRAF);

      // Rydd opp opprettede Blob URL-er
      imageStore.forEach(img => URL.revokeObjectURL(img.url));
      imageStore = [];
      activeImageId = null;
      mapMarkers = {};
      
      document.getElementById('panorama-wrapper').style.display = 'none';
      document.getElementById('map').style.display = 'none';
      document.getElementById('upload-screen').style.display = 'flex';
      document.getElementById('fileInput').value = '';
    }
  </script>
</body>
</html>
