<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Tittel og Beskrivelse -->
  <title>Bildefremviser 360</title>
  <meta name="description" content="Enkel visning og drag-and-drop av 360-bilder med kartvisning." />

  <!-- Open Graph / Teams-forhåndsvisning -->
  <meta property="og:site_name" content="Bildefremviser 360" />
  <meta property="og:title" content="Bildefremviser 360" />
  <meta property="og:description" content="Enkel visning og drag-and-drop av 360-bilder med kartvisning." />
  <meta property="og:type" content="website" />

  <!-- Pannellum 360 Viewer CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>

  <!-- Leaflet for Kartvisning -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- EXIF.js for å hente GPS-data fra JPG/PNG -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <!-- Three.js og EXRLoader for EXR-støtte -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #d8e2d2;
      color: #1a1d1e;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #upload-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .top-header {
      padding: 24px 32px;
      flex-shrink: 0;
    }
    .top-header p {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #5a6b4d;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .top-header h1 { 
      font-size: 1.8rem; 
      font-weight: 300; 
      color: #1a1d1e;
    }
    
    .main-card {
      flex-grow: 1;
      background: #ffffff;
      border-radius: 12px 12px 0 0;
      margin: 0 16px;
      padding: 24px;
      box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
    }

    .drop-zone {
      flex-grow: 1;
      border: 1px dashed #b8c4b2;
      border-radius: 8px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drop-zone:hover, .drop-zone.dragover { 
      background: #f9fbf8; 
      border-color: #82a760;
    }
    
    .upload-icon {
      width: 56px;
      height: 56px;
      background: #fff;
      border: 1px solid #e2e8e0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: transform 0.2s;
    }
    .drop-zone:hover .upload-icon { transform: scale(1.05); }
    .upload-icon svg { stroke: #6b8258; }

    .drop-zone h2 {
      font-size: 1.1rem; 
      font-weight: 300; 
      margin-bottom: 24px; 
      color: #444;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: #555;
      transition: all 0.2s;
    }
    .btn:hover { background: #f8fbf5; border-color: #82a760; color: #1a1d1e; }

    #panorama-wrapper {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: #000;
    }
    #panorama, #exr-canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 20;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
    }

    #map {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 280px;
      height: 280px;
      border-radius: 8px;
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      z-index: 20;
      background: #fcfcfb;
    }
    .leaflet-control-attribution { display: none !important; }

    @keyframes blink-beam {
      0% { opacity: 0.1; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.1; transform: scale(0.9); }
    }
    .blinking-beam {
      animation: blink-beam 2s infinite ease-in-out;
      transform-origin: 30px 30px;
    }
  </style>
</head>
<body>

  <div id="upload-screen">
    <div class="top-header">
      <p>360-foto</p>
      <h1>Bildefremviser</h1>
    </div>

    <div class="main-card">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <h2>Dra og slipp et 360-bilde her (JPG, PNG eller EXR)</h2>
        <button class="btn" style="pointer-events: none;">Velg fil fra disk</button>
        <input type="file" id="fileInput" accept="image/jpeg, image/png, .exr" style="display: none;" onchange="handleFile(this.files[0])" />
      </div>
    </div>
  </div>

  <div id="panorama-wrapper">
    <button class="btn close-btn" onclick="resetViewer()">Lukk bilde</button>
    <div id="panorama"></div>
    <div id="exr-canvas-container"></div>
    <div id="map"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    let viewer = null;
    let map = null;
    let marker = null;
    let syncRAF = null;
    let initialDirection = 0;
    let currentImgUrl = null;

    // Three.js variabler for EXR
    let threeRenderer, threeScene, threeCamera, threeMesh;
    let isThreeActive = false;
    let isUserInteracting = false, onPointerDownPointerX = 0, onPointerDownPointerY = 0;
    let lon = 0, onPointerDownLon = 0, lat = 0, onPointerDownLat = 0, phi = 0, theta = 0;

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      const fileName = file.name.toLowerCase();
      
      if (currentImgUrl) URL.revokeObjectURL(currentImgUrl);
      currentImgUrl = URL.createObjectURL(file);
      
      document.getElementById('upload-screen').style.display = 'none';
      document.getElementById('panorama-wrapper').style.display = 'block';

      if (fileName.endsWith('.exr')) {
        document.getElementById('panorama').style.display = 'none';
        document.getElementById('exr-canvas-container').style.display = 'block';
        initEXRViewer(file);
      } else {
        document.getElementById('exr-canvas-container').style.display = 'none';
        document.getElementById('panorama').style.display = 'block';
        initViewer(currentImgUrl);

        EXIF.getData(file, function() {
          const latVal = EXIF.getTag(this, "GPSLatitude");
          const lngVal = EXIF.getTag(this, "GPSLongitude");
          
          if (latVal && lngVal) {
             let latDeg = getNum(latVal[0]) + getNum(latVal[1])/60 + getNum(latVal[2])/3600;
             let lngDeg = getNum(lngVal[0]) + getNum(lngVal[1])/60 + getNum(lngVal[2])/3600;
             if (EXIF.getTag(this, "GPSLatitudeRef") === 'S') latDeg = -latDeg;
             if (EXIF.getTag(this, "GPSLongitudeRef") === 'W') lngDeg = -lngDeg;
             let imgDir = getNum(EXIF.getTag(this, "GPSImgDirection") || 0);

             initMap(latDeg, lngDeg, imgDir);
          }
        });
      }
    }

    function getNum(val) {
      if (!val) return 0;
      if (val.numerator !== undefined) return val.numerator / val.denominator;
      return parseFloat(val);
    }

    function initViewer(url) {
      if (viewer) viewer.destroy();
      viewer = pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: url,
        autoLoad: true,
        showZoomCtrl: true,
        mouseZoom: true,
        compass: false 
      });
      cancelAnimationFrame(syncRAF);
      syncLoop();
    }

    // --- Three.js EXR Renderer ---
    function initEXRViewer(file) {
      const container = document.getElementById('exr-canvas-container');
      container.innerHTML = '';
      isThreeActive = true;

      threeScene = new THREE.Scene();
      threeCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1);

      const reader = new FileReader();
      reader.onload = function (e) {
        const loader = new THREE.EXRLoader();
        const texData = loader.parse(e.target.result);
        const texture = new THREE.DataTexture(texData.data, texData.width, texData.height, texData.format, texData.type);
        texture.needsUpdate = true;

        const material = new THREE.MeshBasicMaterial({ map: texture });
        threeMesh = new THREE.Mesh(geometry, material);
        threeScene.add(threeMesh);
      };
      reader.readAsArrayBuffer(file);

      threeRenderer = new THREE.WebGLRenderer({ antialias: true });
      threeRenderer.setPixelRatio(window.devicePixelRatio);
      threeRenderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(threeRenderer.domElement);

      container.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('resize', onWindowResize);

      animateThree();
    }

    function onPointerDown(e) {
      isUserInteracting = true;
      onPointerDownPointerX = e.clientX;
      onPointerDownPointerY = e.clientY;
      onPointerDownLon = lon;
      onPointerDownLat = lat;
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
    }

    function onPointerMove(e) {
      if (!isUserInteracting) return;
      lon = (onPointerDownPointerX - e.clientX) * 0.1 + onPointerDownLon;
      lat = (e.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
    }

    function onPointerUp() {
      isUserInteracting = false;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
    }

    function onWindowResize() {
      if (!isThreeActive) return;
      threeCamera.aspect = window.innerWidth / window.innerHeight;
      threeCamera.updateProjectionMatrix();
      threeRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animateThree() {
      if (!isThreeActive) return;
      requestAnimationFrame(animateThree);
      lat = Math.max(-85, Math.min(85, lat));
      phi = THREE.MathUtils.degToRad(90 - lat);
      theta = THREE.MathUtils.degToRad(lon);

      threeCamera.position.x = 100 * Math.sin(phi) * Math.cos(theta);
      threeCamera.position.y = 100 * Math.cos(phi);
      threeCamera.position.z = 100 * Math.sin(phi) * Math.sin(theta);
      threeCamera.lookAt(threeScene.position);
      threeRenderer.render(threeScene, threeCamera);
    }

    function initMap(lat, lng, imgDir) {
      initialDirection = imgDir || 0;
      document.getElementById('map').style.display = 'block';
      if (map) map.remove();
      
      map = L.map('map', { zoomControl: true, attributionControl: false, dragging: true, scrollWheelZoom: true }).setView([lat, lng], 15);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

      const iconHtml = `
        <div id="compass-marker" style="width: 60px; height: 60px; transform-origin: center;">
          <svg width="60" height="60" viewBox="0 0 60 60" style="overflow: visible;">
            <defs>
              <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#82a760" stop-opacity="0" />
                <stop offset="100%" stop-color="#82a760" stop-opacity="0.85" />
              </linearGradient>
            </defs>
            <path class="blinking-beam" d="M30 30 L10 5 A 30 30 0 0 1 50 5 Z" fill="url(#beamGrad)" />
            <path d="M30 15 L40 38 L30 33 L20 38 Z" fill="#1a1d1e" stroke="#ffffff" stroke-width="2.5" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));" />
          </svg>
        </div>`;
      
      const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [60, 60], iconAnchor: [30, 30] });
      marker = L.marker([lat, lng], {icon: customIcon}).addTo(map);
    }

    function syncLoop() {
      const compassMarker = document.getElementById('compass-marker');
      if (viewer && compassMarker) {
          const yaw = viewer.getYaw();
          const totalRotation = yaw + initialDirection;
          compassMarker.style.transform = `rotate(${totalRotation}deg)`;
      }
      syncRAF = requestAnimationFrame(syncLoop);
    }

    function resetViewer() {
      if (viewer) { viewer.destroy(); viewer = null; }
      if (map) { map.remove(); map = null; }
      if (isThreeActive) {
        isThreeActive = false;
        if (threeRenderer) threeRenderer.dispose();
      }
      cancelAnimationFrame(syncRAF);
      
      document.getElementById('panorama-wrapper').style.display = 'none';
      document.getElementById('map').style.display = 'none';
      document.getElementById('upload-screen').style.display = 'flex';
      document.getElementById('fileInput').value = '';
      
      if (currentImgUrl) {
        URL.revokeObjectURL(currentImgUrl);
        currentImgUrl = null;
      }
    }
  </script>
</body>
</html>
